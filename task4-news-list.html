<!DOCTYPE html>
<html>
<head>
    <title>News List</title>
    <style>
        .news-item {
            margin: 10px 0;
        }
        .delete-button {
            margin-left: 10px;
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>News List</h1>
    <div id="news-container">
        <div class="news-item">
            <span>News Item 1</span>
            <button class="delete-button" onclick="deleteNews(this)">Delete</button>
        </div>
        <div class="news-item">
            <span>News Item 2</span>
            <button class="delete-button" onclick="deleteNews(this)">Delete</button>
        </div>
    </div>
    <script>
        function deleteNews(button) {
            const newsItem = button.parentNode;
            newsItem.parentNode.removeChild(newsItem);
        }
    </script>
</body>
</html>
