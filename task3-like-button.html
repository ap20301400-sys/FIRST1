<!DOCTYPE html>
<html>
<head>
    <title>Like Counter</title>
</head>
<body>
    <h1>Like Counter</h1>
    <button onclick="likeClick()">Like</button>
    <p>Total Likes: <span id="count">0</span></p>
    <script>
        let count = 0;
        function likeClick() {
            count++;
            document.getElementById('count').innerHTML = count;
        }
    </script>
</body>
</html>
