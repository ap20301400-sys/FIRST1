<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        <form id="converter">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" placeholder="Amount" required>
            <label for="from-currency">From:</label>
            <select id="from-currency" required></select>
            <label for="to-currency">To:</label>
            <select id="to-currency" required></select>
            <button type="submit">Convert</button>
        </form>
        <h2 id="result"></h2>
    </div>
    <script>
        const apiKey = 'YOUR_API_KEY'; // Replace with your actual API key
        const fromCurrencySelect = document.getElementById('from-currency');
        const toCurrencySelect = document.getElementById('to-currency');
        const resultDisplay = document.getElementById('result');

        // Fetch currency list and populate dropdowns
        async function fetchCurrencies() {
            const response = await fetch(`https://api.exchangerate-api.com/v4/latest/USD`);
            const data = await response.json();
            const currencies = Object.keys(data.rates);
            currencies.forEach(currency => {
                const option1 = document.createElement('option');
                option1.value = currency;
                option1.textContent = currency;
                fromCurrencySelect.appendChild(option1);

                const option2 = document.createElement('option');
                option2.value = currency;
                option2.textContent = currency;
                toCurrencySelect.appendChild(option2);
            });
        }

        fetchCurrencies();

        // Convert currency when form is submitted
        document.getElementById('converter').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('amount').value;
            const fromCurrency = fromCurrencySelect.value;
            const toCurrency = toCurrencySelect.value;

            const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${fromCurrency}`);
            const data = await response.json();
            const rate = data.rates[toCurrency];
            const convertedAmount = (amount * rate).toFixed(2);

            resultDisplay.textContent = `${amount} ${fromCurrency} = ${convertedAmount} ${toCurrency}`;
        });
    </script>
</body>
</html>
