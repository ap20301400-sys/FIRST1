<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Tree</title>
    <style>
        .tree { list-style-type: none; }
        .tree li { cursor: pointer; }
        .tree li:hover { font-weight: bold; }
        .folder:hover > ul { display: block; }
        .folder > ul { display: none; }
    </style>
</head>
<body>
    <ul class="tree">
        <li class="folder">Root
            <ul>
                <li class="folder">Folder 1
                    <ul>
                        <li>File 1-1</li>
                        <li class="folder">Folder 1-2
                            <ul>
                                <li>File 1-2-1</li>
                                <li>File 1-2-2</li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li class="folder">Folder 2
                    <ul>
                        <li>File 2-1</li>
                        <li>File 2-2</li>
                    </ul>
                </li>
            </ul>
        </li>
    </ul>
</body>
</html>
