<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4e54c8, #8e4ecf);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin: 20px;
        }
        .day {
            padding: 20px;
            border: 1px solid white;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: pointer;
        }
        .day:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        #reminders {
            margin-top: 20px;
            list-style: none;
            padding: 0;
        }
        #reminders li {
            padding: 10px;
            background: #333;
            margin: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Calendar</h1>
    <div id="calendar"></div>
    <h2>Reminders</h2>
    <ul id="reminders"></ul>
    <input type="text" id="reminderInput" placeholder="Add a reminder..." />
    <button id="saveReminder">Save Reminder</button>
    <script>
        const calendarElement = document.getElementById('calendar');
        const remindersElement = document.getElementById('reminders');
        const reminderInput = document.getElementById('reminderInput');
        const saveReminderButton = document.getElementById('saveReminder');

        let currentDate = new Date();

        function renderCalendar() {
            calendarElement.innerHTML = '';
            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            for (let i = 0; i < firstDay.getDay(); i++) {
                calendarElement.innerHTML += '<div class="day"></div>';
            }
            for (let day = 1; day <= lastDay.getDate(); day++) {
                calendarElement.innerHTML += `<div class="day" onclick="addReminder(event, ${day})">${day}</div>`;
            }
        }

        function addReminder(event, day) {
            const reminder = prompt('Enter reminder for ' + day + ' ' + (currentDate.getMonth() + 1) + ' ' + currentDate.getFullYear());
            if (reminder) {
                const reminderItem = document.createElement('li');
                reminderItem.textContent = reminder + ' (Day: ' + day + ')';
                reminderItem.onclick = function() {
                    this.remove();
                    saveReminders();
                };
                remindersElement.appendChild(reminderItem);
                saveReminders();
            }
        }

        function saveReminders() {
            const reminders = Array.from(remindersElement.children).map(li => li.textContent);
            localStorage.setItem('reminders', JSON.stringify(reminders));
        }

        function loadReminders() {
            const reminders = JSON.parse(localStorage.getItem('reminders')) || [];
            reminders.forEach(reminder => {
                const reminderItem = document.createElement('li');
                reminderItem.textContent = reminder;
                reminderItem.onclick = function() {
                    this.remove();
                    saveReminders();
                };
                remindersElement.appendChild(reminderItem);
            });
        }

        loadReminders();
        renderCalendar();
    </script>
</body>
</html>
